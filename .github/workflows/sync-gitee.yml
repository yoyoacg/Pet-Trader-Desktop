name: Sync to Gitee

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 完整检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 强制镜像推送到 Gitee
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }} # 格式：用户名/仓库名，例如 yoyoacg/Pet-Trader-Desktop
        run: |
          if [ -z "$GITEE_USER" ] || [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPO" ]; then
            echo "错误：请在 Repository secrets 中配置 GITEE_USER、GITEE_TOKEN、GITEE_REPO"
            exit 1
          fi
          git push -f "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" --all
          git push -f "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" --tags
