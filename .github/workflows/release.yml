name: Build & Release Windows

on:
  push:
    tags:
      - 'v*' # 推送形如 v0.1.0 的标签时触发

permissions:
  contents: write # 允许创建 Release 并上传安装包

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 编译并打包 Windows 客户端
        env:
          VITE_API_BASE_URL: https://pet.yzxacg.cn
        run: npm run dist -- --publish never

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
          generate_release_notes: true # 自动根据提交记录生成更新日志

      - name: 同步安装包到官网服务器
        timeout-minutes: 15
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "错误：请在当前仓库 Settings -> Secrets and variables -> Actions -> Repository secrets 中配置 SERVER_HOST、SERVER_USER、SERVER_SSH_KEY"
            exit 1
          fi

          PORT="${SERVER_PORT:-22}"
          mkdir -p upload-dist
          VERSION=$(node -p "require('./package.json').version")
          EXE_SRC=$(find release -maxdepth 1 -type f -name "*.exe" | head -n 1)
          ZIP_SRC=$(find release -maxdepth 1 -type f -name "*.zip" | head -n 1)
          EXE_NAME="Pet-Trader-Desktop-${VERSION}-Setup.exe"
          ZIP_NAME="Pet-Trader-Desktop-${VERSION}-win.zip"
          [ -n "$EXE_SRC" ] && cp "$EXE_SRC" "upload-dist/$EXE_NAME" || EXE_NAME=""
          [ -n "$ZIP_SRC" ] && cp "$ZIP_SRC" "upload-dist/$ZIP_NAME" || ZIP_NAME=""
          BUILT_AT=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          printf '{"version":"%s","exe":"%s","zip":"%s","builtAt":"%s"}\n' \
            "$VERSION" "$EXE_NAME" "$ZIP_NAME" "$BUILT_AT" > upload-dist/manifest.json

          KEY_FILE="$HOME/.ssh/deploy_key"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          COMMON_OPTS="-i $KEY_FILE -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          REMOTE_DIR="/opt/pet.yzxacg.cn/downloads"

          echo "准备清理远程旧安装包..."
          ssh $COMMON_OPTS -p "$PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p $REMOTE_DIR && chmod 755 $REMOTE_DIR && rm -f $REMOTE_DIR/*.exe $REMOTE_DIR/*.zip"

          if [ -n "$EXE_NAME" ]; then
            echo "正在上传 $EXE_NAME ($(du -h "upload-dist/$EXE_NAME" | awk '{print $1}'))..."
            scp $COMMON_OPTS -P "$PORT" "upload-dist/$EXE_NAME" "$SERVER_USER@$SERVER_HOST:$REMOTE_DIR/"
          fi
          if [ -n "$ZIP_NAME" ]; then
            echo "正在上传 $ZIP_NAME ($(du -h "upload-dist/$ZIP_NAME" | awk '{print $1}'))..."
            scp $COMMON_OPTS -P "$PORT" "upload-dist/$ZIP_NAME" "$SERVER_USER@$SERVER_HOST:$REMOTE_DIR/"
          fi
          echo "正在上传 manifest.json..."
          scp $COMMON_OPTS -P "$PORT" "upload-dist/manifest.json" "$SERVER_USER@$SERVER_HOST:$REMOTE_DIR/"
          ssh $COMMON_OPTS -p "$PORT" "$SERVER_USER@$SERVER_HOST" "chmod 644 $REMOTE_DIR/*"
