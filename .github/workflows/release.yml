name: Build & Release Windows

on:
  push:
    tags:
      - 'v*' # 推送形如 v0.1.0 的标签时触发

permissions:
  contents: write # 允许创建 Release 并上传安装包

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 编译并打包 Windows 客户端
        env:
          VITE_API_BASE_URL: https://pet.yzxacg.cn
        run: npm run dist -- --publish never

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
          generate_release_notes: true # 自动根据提交记录生成更新日志
